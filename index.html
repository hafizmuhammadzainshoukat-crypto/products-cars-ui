<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Cards UI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Our Products</h1>
</header>

<section class="products">

  <!-- CARD 1 -->
  <div class="card">
    <h3>Wireless Headphones</h3>
    <p>High quality sound and comfort.</p>
    <span class="price">$49</span>
    <button>Buy Now</button>
  </div>

  <!-- CARD 2 -->
  <div class="card">
    <h3>Smart Watch</h3>
    <p>Track your fitness and health.</p>
    <span class="price">$79</span>
    <button>Buy Now</button>
  </div>

  <!-- CARD 3 -->
  <div class="card">
    <h3>Gaming Mouse</h3>
    <p>High precision for gamers.</p>
    <span class="price">$29</span>
    <button>Buy Now</button>
  </div>

</section>

</body>
</html>
